# CodeRabbit is retired. Disable automatic reviews and replies.
# Remove the organization app installation; Global overrides can supersede this file.
reviews:
  profile: chill

  request_changes_workflow: false

  poem: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  auto_apply_labels: false
  collapse_walkthrough: true

  path_instructions:
    - path: 'src/**/*.ts'
      instructions: |
        This package is a published TypeScript SDK (CommonJS and ESM builds) built on viem.
        Treat any change to an exported type, function signature, or default behaviour as a public API change and say so.
        Keep `src/` free of Node built-in modules; the library must run in browsers.
        Read the ADRs under `docs/adrs/` before reporting a design defect that an accepted ADR already decides.
    - path: 'tests/**/*.test.ts'
      instructions: |
        Unit tests under `tests/unit` must not need network access or a live RPC.
        Integration tests under `tests/integration` may use `CELO_MAINNET_RPC_URL` and are not run in CI.

  path_filters:
    - '!pnpm-lock.yaml'
    - '!src/cache/**'
    - '!src/core/abis/**'
    - '!dist/**'
    - '!coverage/**'

  auto_review:
    enabled: false
    base_branches: []
    drafts: false
    ignore_usernames: []
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5

chat:
  auto_reply: false
