 
# Schedule: every second Monday at 06:00 UTC for all ecosystems.
# Dependabot parses cron with the fugit library. `mon%2` matches Mondays whose
# week count since Monday 2018-12-31 is even (exact 14-day cadence; next runs
# 2026-10-26 and 2026-11-09). Plain cron cannot express "every other week".
# Security updates ignore the schedule and still open immediately.
# Source: https://github.com/dependabot/dependabot-core/issues/12246
version: 2
updates:
  # ── npm dependencies ───────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * mon%2"
      timezone: "UTC"
 
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
 
    open-pull-requests-limit: 5
 
    # Group updates to reduce PR noise
    groups:
      production-deps:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
 
      dev-deps:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
 
    # Commit message prefix for easy filtering
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
 
    labels:
      - "dependencies"
 
  # ── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * mon%2"
      timezone: "UTC"
 
    cooldown:
      default-days: 7
 
    open-pull-requests-limit: 3
 
    groups:
      gh-actions:
        applies-to: version-updates
        patterns:
          - "*"
 
    commit-message:
      prefix: "chore(ci)"
 
    labels:
      - "dependencies"
      - "github_actions"